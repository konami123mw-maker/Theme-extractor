name: Build S18 Theme Extractor from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"
          if [ -z "${ZIP_FILE}" ]; then
            echo 'لم أجد ملف ZIP في جذر المستودع.'
            exit 1
          fi
          mkdir -p /tmp/s18-source
          unzip -q "$ZIP_FILE" -d /tmp/s18-source
          SETTINGS_FILE="$(find /tmp/s18-source -type f -name settings.gradle.kts | head -n 1)"
          if [ -z "${SETTINGS_FILE}" ]; then
            echo 'ملف settings.gradle.kts غير موجود داخل ZIP.'
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/
          test -f "$GITHUB_WORKSPACE/app/build.gradle.kts"
          test -f "$GITHUB_WORKSPACE/settings.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S18-Theme-Extractor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
